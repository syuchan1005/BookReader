overwrite: true
schema: "../../schema.graphql"
generates:
  generated/GQLResolvers.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-resolvers
      - "src/graphql/codegen/typescript-schema.cjs"
      - add:
          content:
            - "/* This file generated by @graphql-codegen */"
      - add:
          placement: prepend
          content:
            - "export type BigInt = number;"
            - "export type IntRange = (number | [number, number])[];"
config:
  strictScalars: true
  enumsAsConst: true
  useTypeImports: true
  scalars:
    BigInt: BigInt
    IntRange: IntRange
    File: File
  mappers:
    BookInfo: "../src/database/models/BookInfo#BookInfo as BookInfoModel"
    Book: "../src/database/models/Book#Book as BookModel"
