overwrite: true
schema: "../../schema.graphql"
documents: "queries/**/*.gql"
generates:
  generated/GQLQueries.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
      - add:
          content:
            - "/* This file generated by @graphql-codegen */"
      - add:
          placement: prepend
          content:
            - "export type BigInt = number;"
            - "export type IntRange = (number | [number, number])[];"
    config:
      avoidOptionals:
        field: true
        inputValue: false
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      strictScalars: true
      enumsAsConst: true
      scalars:
        BigInt: BigInt
        IntRange: IntRange
        File: File
